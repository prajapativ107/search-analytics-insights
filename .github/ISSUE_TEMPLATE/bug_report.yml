name: "🐛 Bug Report"
description: "Report a bug to help us improve SearchLens"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "e.g., The search widget displays an error on PHP 8.2..."
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: "Steps to Reproduce"
      description: "Explain the steps required to reproduce the bug."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: "Actual Behavior"
      description: "What actually happened?"
    validations:
      required: true
  - type: input
    id: wp-version
    attributes:
      label: "WordPress Version"
      placeholder: "e.g. 6.5.3"
    validations:
      required: false
  - type: input
    id: php-version
    attributes:
      label: "PHP Version"
      placeholder: "e.g. 8.1.18"
    validations:
      required: false
  - type: input
    id: plugin-version
    attributes:
      label: "Plugin Version"
      placeholder: "e.g. 1.0.0"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or Video"
      description: "Add any screenshots or links to video recordings demonstrating the issue."
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: "Checklist"
      options:
        - label: "I have confirmed this issue exists on the latest version of SearchLens."
          required: true
        - label: "I have searched for existing GitHub issues and found no duplicate reports."
          required: true
