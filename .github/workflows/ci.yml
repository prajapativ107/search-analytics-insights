name: CI

# Trigger workflow on pushes and pull requests to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Set minimum permissions required for checked out code
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Coding Standards (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test against WordPress minimum supported and modern PHP environments
        php-version: [ "8.0", "8.1", "8.2", "8.3" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: cs2pr

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: PHP Syntax Check (Lint)
        run: |
          find . -name "*.php" ! -path "./vendor/*" ! -path "./node_modules/*" -print0 | xargs -0 -n 1 -P 4 php -l

      - name: Run WordPress Coding Standards (PHPCS)
        run: |
          # Run PHPCS, generate checkstyle report, and capture exit code
          vendor/bin/phpcs --report-checkstyle=./phpcs-report.xml || phpcs_status=$?
          
          # Annotate PR diff using cs2pr
          if [ -f ./phpcs-report.xml ]; then
            cs2pr ./phpcs-report.xml
          fi
          
          # Exit with original PHPCS status to fail the workflow on errors
          exit ${phpcs_status:-0}
