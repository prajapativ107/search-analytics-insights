name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly cron trigger: runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'

permissions:
  # Minimum required permissions for CodeQL upload to Security tab
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Code Security
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Initialize CodeQL tool for PHP analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: php

      # Perform CodeQL analysis and post results to GitHub Security tab
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
